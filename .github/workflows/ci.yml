name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ai/requirements.txt

      - name: Install
        run: |
          npm ci
          pip install -r ai/requirements.txt

      - name: AI pipeline tests
        run: python -m pytest ai/tests -q

      - name: Contract, invariant and integration tests
        run: npx hardhat test

      - name: Coverage
        run: npx hardhat coverage

      - name: Release checklist
        run: npm run check

  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: crytic/slither-action@v0.4.0
        with:
          target: .
          node-version: 22
          slither-args: --filter-paths "node_modules|contracts/test"
          fail-on: high
